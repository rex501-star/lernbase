<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Lernhub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#14162b;--mute:#6b7089;--line:#e4e6f0;--acc:#5b5bf0;--acc2:#18c5a4;--bad:#e5484d;--r:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0e1a;--panel:#161830;--ink:#eceefb;--mute:#8d92b3;--line:#262a4a}}
:root[data-theme=dark]{--bg:#0d0e1a;--panel:#161830;--ink:#eceefb;--mute:#8d92b3;--line:#262a4a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500;transition:transform .15s,opacity .15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
/* Login */
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(91,91,240,.25),transparent 45%),radial-gradient(circle at 85% 90%,rgba(24,197,164,.2),transparent 40%)}
#auth .card{width:min(400px,100%);padding:32px}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;margin:20px 0 16px;background:var(--bg);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* App */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside .brand{padding:0 8px 18px}
#nav{position:relative;display:flex;flex-direction:column;gap:4px}
.ind{position:absolute;left:0;top:0;width:100%;height:42px;border-radius:12px;background:linear-gradient(90deg,rgba(91,91,240,.2),rgba(24,197,164,.08));border-left:3px solid var(--acc);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.34,1.56,.64,1),height .3s,opacity .3s}
.nav{position:relative;z-index:1;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;color:var(--mute);cursor:pointer;border:0;background:none;text-align:left;width:100%;transition:color .25s,transform .25s;animation:navin .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.nav .ic{width:24px;text-align:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.nav:hover{color:var(--ink);transform:translateX(5px)}.nav:hover .ic{transform:scale(1.25) rotate(-8deg)}
.nav.on{color:var(--ink);font-weight:600}.nav.on .ic{transform:scale(1.15)}
@keyframes navin{from{opacity:0;transform:translateX(-18px)}}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sidefoot hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:0 6px}
.tool{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:.25s}
.tool:hover{border-color:var(--acc);transform:translateY(-1px)}
.tool .sw{margin-left:auto;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .3s}
.tool .sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tool.dark .sw{background:var(--acc)}.tool.dark .sw i{transform:translateX(16px)}
.tool.danger{color:var(--bad);border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.08)}
.tool.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.who{font-size:12px;color:var(--mute);padding:4px 6px;word-break:break-all}
main{padding:32px clamp(16px,4vw,48px);max-width:1200px;width:100%}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat b{font:700 32px 'Space Grotesk';display:block}.stat span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pkg{display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
.pkg:hover{transform:translateY(-3px);border-color:var(--acc)}
.pkg .ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-weight:700}
.pkg p{color:var(--mute);font-size:14px;flex:1}
.meta{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mute);font-weight:500;font-size:13px}
.tablewrap{overflow-x:auto}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:12px;transition:.2s}
.drop.over,.drop:hover{border-color:var(--acc);background:rgba(91,91,240,.06)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(91,91,240,.15);color:var(--acc)}
/* Modal / Viewer */
.modal{position:fixed;inset:0;background:rgba(5,6,15,.6);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
.modal .box{background:var(--panel);border-radius:var(--r);width:min(1000px,100%);height:min(86vh,800px);display:flex;flex-direction:column;overflow:hidden;animation:pop .25s}
.modal .box.sm{height:auto;width:min(720px,100%);padding:24px;overflow:auto}
.modal .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.modal iframe{flex:1;border:0;background:#fff}
pre{background:var(--bg);padding:14px;border-radius:10px;overflow:auto;font-size:12px;max-height:300px}
.cap{display:flex;gap:8px;align-items:center;margin-bottom:10px}.cap canvas{border-radius:10px;border:1px solid var(--line);max-width:100%}
select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;color:var(--ink);font:inherit}
.code{font:700 34px 'Space Grotesk',monospace;letter-spacing:.12em;margin:10px 0;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;user-select:all}
.badge.on{background:rgba(24,197,164,.18);color:var(--acc2)}.badge.x{background:rgba(229,72,77,.15);color:var(--bad)}
#view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}#view>:nth-child(2){animation-delay:.06s}#view>:nth-child(3){animation-delay:.12s}#view>:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:14px;margin:6px 0 12px;line-height:0}.qrbox img{display:block}
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.pk{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);margin:0;color:var(--ink);font-size:14px}.pk input{width:auto;margin:0}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.nu{display:flex;gap:8px}.nu input{width:100px}.nu select{flex:1}
.atabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:24px;overflow-x:auto;width:fit-content;max-width:100%}
.atabs button{border:0;background:none;color:var(--mute);padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .25s,color .25s,transform .2s}
.atabs button:hover{color:var(--ink);transform:translateY(-1px)}
.atabs button.on{background:linear-gradient(135deg,var(--acc),#7a5bf0);color:#fff;box-shadow:0 4px 14px rgba(91,91,240,.35)}
#ab{animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.modal.max{padding:0}.modal.max .box{width:100%;height:100%;border-radius:0}
#live{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#live i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
#live.on i{background:var(--acc2);animation:pulse 1.8s infinite}
#live.off i{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,197,164,.6)}70%{box-shadow:0 0 0 8px rgba(24,197,164,0)}100%{box-shadow:0 0 0 0 rgba(24,197,164,0)}}
.tl{position:relative;padding-left:26px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:18px}
.tl .it{position:relative;animation:pop .4s backwards}
.tl .it::before{content:"";position:absolute;left:-33px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg)}
.tl .it:first-child::before{background:var(--acc2);animation:pulse 1.8s infinite}
.tl ul{margin:8px 0 0 18px;color:var(--mute);font-size:14px}
.tl .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:99;transition:opacity .3s}
.empty{text-align:center;color:var(--mute);padding:48px 16px}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto}#nav{flex-direction:row;flex-wrap:wrap}.ind{display:none}.nav.on{background:var(--bg)}.sidefoot{margin-top:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wt{--c:#8d92b3;display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;font-weight:500;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 65%,var(--ink))}
button.chip{border:2px solid transparent;cursor:pointer;font:inherit;font-size:13px;opacity:.55;transition:.2s}button.chip.on{opacity:1;border-color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.vr td:first-child{border-left:4px solid var(--c)}
.vbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.vbar input,.vbar select{width:auto;flex:1;min-width:150px;margin:0}
.lprog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}.lprog i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.lc{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;margin-bottom:14px}
.lc img,.bio img{max-width:100%;max-height:200px;border-radius:10px;object-fit:cover}
.bio{padding:0;overflow:hidden}.bio img{width:100%;height:170px;max-height:none;border-radius:0}.bio .bd{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
/* Checkboxen */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;padding:0;margin:0;flex:none;border:2px solid var(--line);border-radius:6px;background:var(--bg);display:inline-grid;place-content:center;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
input[type=checkbox]::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
input[type=checkbox]:hover{border-color:var(--acc)}input[type=checkbox]:active{transform:scale(.9)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
input[type=checkbox]:checked::after{transform:rotate(-45deg) scale(1)}
.pk{transition:border-color .2s,background .2s}.pk:hover{border-color:var(--acc)}.pk:has(input:checked){border-color:var(--acc);background:rgba(91,91,240,.1)}
/* Dropdowns */
.dd{position:relative;margin-bottom:12px}.nu{align-items:flex-start}.nu .dd{flex:1;margin:0}.vbar .dd{flex:1;min-width:170px;margin:0}
.ddb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.ddb:hover,.dd.open .ddb{border-color:var(--acc)}.dd.open .ddb{box-shadow:0 0 0 3px rgba(91,91,240,.18)}
.ddb span,.ddo span{display:flex;align-items:center;gap:8px}
.ddb i{width:8px;height:8px;flex:none;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);transition:transform .25s}
.dd.open .ddb i{transform:rotate(225deg) translateY(-2px)}
.ddl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.25);max-height:260px;overflow:auto;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top;transition:opacity .18s,transform .18s,visibility .18s}
.dd.up .ddl{top:auto;bottom:calc(100% + 6px);transform-origin:bottom}.dd.open .ddl{opacity:1;visibility:visible;transform:none}
.ddo{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ddo:hover{background:rgba(91,91,240,.12)}.ddo.on{background:linear-gradient(90deg,rgba(91,91,240,.2),rgba(24,197,164,.1));font-weight:600}
.ddo.on::after{content:"✓";color:var(--acc2)}.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* Lernmodus-Animationen */
.fc{perspective:1400px;display:grid;margin-bottom:16px;animation:cardin .45s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .36s cubic-bezier(.5,0,.75,0),opacity .36s}
.fc-in{display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.34,1.3,.5,1)}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc .face{grid-area:1/1;margin:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);transition:border-color .3s,box-shadow .3s,transform .2s,background .3s}
.fc .face.back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(91,91,240,.1),rgba(24,197,164,.1))}
.fc:not(.flip):hover .face{border-color:var(--acc);transform:translateY(-2px)}
.fc.gone-y{transform:translateX(130%) rotate(14deg);opacity:0}
.fc.gone-n{transform:translateX(-130%) rotate(-14deg);opacity:0}
.fc.gone-y .face{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(24,197,164,.4)}
.fc.gone-n .face{border-color:var(--bad);box-shadow:0 0 0 3px rgba(229,72,77,.4)}
.lbtn{justify-content:center;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.lbtn.show{opacity:1;transform:none;pointer-events:auto}
.lkeys{text-align:center;margin-top:14px;font-size:12px}
.lprog{height:8px}.lprog i{background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.34,1.3,.5,1);border-radius:9px}
.lc.done{position:relative;overflow:hidden;animation:cardin .5s cubic-bezier(.2,.8,.2,1) backwards}
.lc.done .chk{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));animation:chk .7s cubic-bezier(.34,1.56,.64,1) backwards .15s}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.95)}}
@keyframes chk{from{transform:scale(0) rotate(-90deg)}}
@keyframes fall{to{top:105%;opacity:.7}}
@media(prefers-reduced-motion:reduce){.confetti{display:none}}
/* Lernkarte: einfaches Umdrehen statt 3D (kein Überlappen, kein Ruckeln) */
.fc{perspective:none}
.fc-in{transform-style:flat;transition:transform .18s ease;will-change:transform}
.fc.flip .fc-in{transform:none}
.fc.turning .fc-in,.fc.flip.turning .fc-in{transform:scaleX(0)}
.fc .face{backface-visibility:visible;-webkit-backface-visibility:visible;transition:none}
.fc .face.back{display:none;transform:none}
.fc.flip .face:not(.back){display:none}.fc.flip .face.back{display:flex}
.fc:not(.flip):hover .face{transform:none;border-color:var(--acc)}
/* Bio-Kategorien */
details.cat{margin-bottom:22px}
details.cat summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;margin-bottom:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::before{content:"";width:8px;height:8px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .2s}
details.cat[open] summary::before{transform:rotate(45deg)}
details.cat summary h2{font-size:18px;margin:0}
.privlink{color:var(--acc);cursor:pointer;text-decoration:underline}
.priv h3{margin:16px 0 4px;font-size:15px}.priv p,.priv li{font-size:14px;line-height:1.55;color:var(--mute)}.priv ul{padding-left:18px}
/* ===== Tutorial-Player ===== */
.tv-stage{position:relative;height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,rgba(91,91,240,.32),transparent 55%),radial-gradient(circle at 90% 95%,rgba(24,197,164,.28),transparent 50%),var(--bg)}
.tv-stage>*{max-width:100%}
.tv-cap{min-height:88px;text-align:center;margin:14px 0 10px;animation:tvup .5s both}.tv-cap h4{font-size:18px;margin-bottom:4px}.tv-cap p{font-size:14px;color:var(--mute);max-width:560px;margin:0 auto;line-height:1.5}
.tv-prog{display:flex;gap:6px;margin-bottom:14px}.tv-prog button{flex:1;height:6px;border:0;padding:0;border-radius:9px;background:var(--line);overflow:hidden;cursor:pointer;min-width:0}
.tv-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}.tv-prog .done i{width:100%}.tv-prog .active i{animation:tvfill var(--d) linear forwards}
.tv.paused *{animation-play-state:paused!important}
.tv-win{width:min(420px,88%);position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.25);font-size:13px;animation:tvpop .6s cubic-bezier(.34,1.4,.5,1) both}
.tv-tabs{display:flex;gap:4px;margin-bottom:10px;height:30px}.tv-tabs span{flex:1;display:grid;place-items:center;border-radius:8px;color:var(--mute);background:var(--bg)}.tv-tabs .on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.tv-tab{animation:tvtab .4s .5s both}@keyframes tvtab{from{background:var(--bg);color:var(--mute)}to{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}}

async function ping(){
  const el=document.getElementById('live'),t=el.querySelector('span');
  let state='off',txt='Offline';
  if(navigator.onLine){
    try{
      const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),6000),t0=performance.now();
      const r=await fetch(SUPABASE_URL+'/auth/v1/health',{headers:{apikey:SUPABASE_ANON_KEY},signal:ctrl.signal});
      clearTimeout(to);
      if(r.ok){state='on';txt='Online · '+Math.round(performance.now()-t0)+' ms'}else txt='Server antwortet nicht';
    }catch(e){txt='Server nicht erreichbar'}
  }
  el.className=state;t.textContent=txt;
}
ping();setInterval(ping,15000);
addEventListener('online',ping);addEventListener('offline',ping);

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const configured=!SUPABASE_URL.includes('DEIN-PROJEKT');
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

/* ---------- Auth ---------- */
let mode='in',cap='',fails=0,lock=0,busy=false,lastCode=null,gTimer;
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCap(){
  const a=new Uint32Array(5);crypto.getRandomValues(a);cap=[...a].map(n=>CH[n%CH.length]).join('');
  const c=$('#cv'),x=c.getContext('2d'),w=c.width,h=c.height,R=Math.random;
  const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#2b2f57');g.addColorStop(1,'#4a3fa0');x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let i=0;i<7;i++){x.strokeStyle=`hsla(${R()*360},70%,70%,.55)`;x.lineWidth=1+R()*1.5;x.beginPath();x.moveTo(R()*w,R()*h);x.bezierCurveTo(R()*w,R()*h,R()*w,R()*h,R()*w,R()*h);x.stroke()}
  for(let i=0;i<60;i++){x.fillStyle=`rgba(255,255,255,${R()*.5})`;x.fillRect(R()*w,R()*h,2,2)}
  [...cap].forEach((ch,i)=>{x.save();x.translate(20+i*29,34+R()*8-4);x.rotate((R()-.5)*.7);x.font=`700 ${28+R()*6}px monospace`;x.fillStyle=`hsl(${R()*360},80%,85%)`;x.textAlign='center';x.fillText(ch,0,0);x.restore()});

}

  $('#go').textContent={in:'Anmelden',up:'Konto erstellen',guest:'Mit Code eintreten'}[mode];$('#amsg').textContent='';newCap()});
let lvl=0;const LK='lh_lk';
try{const o=JSON.parse(localStorage.getItem(LK)||'{}');lock=o.until||0;lvl=o.lvl||0;fails=o.fails||0}catch(e){}
const saveLk=()=>{try{localStorage.setItem(LK,JSON.stringify({until:lock,lvl,fails}))}catch(e){}};

$('#nm').oninput=()=>{$('#nmc').textContent=$('#nm').value.length+'/20'};
$('#go').onclick=async()=>{

  fails=0;lvl=0;saveLk();if(mode==='up')logEv('signup','Neues Konto',$('#em').value.trim());m.textContent=mode==='up'?'Konto erstellt. Bestätige ggf. deine E-Mail und melde dich an.':'';newCap();
};

const url=async p=>{const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(p.file_path,120);if(error)throw error;return data.signedUrl};
async function download(p){
  const r=await fetch(await url(p));const a=document.createElement('a');
  a.href=URL.createObjectURL(await r.blob());a.download=p.title.replace(/\W+/g,'_')+'.zip';a.click();
  await sb.rpc('increment_downloads',{pid:p.id});toast('Download gestartet');
}
async function preview(p){
  toast('Lernpaket wird geladen …');
  try{
    const zip=await JSZip.loadAsync(await (await fetch(await url(p))).arrayBuffer());
    const names=Object.keys(zip.files).filter(n=>!zip.files[n].dir);
    const idx=names.find(n=>/(^|\/)index\.html$/i.test(n))||names.find(n=>/\.html$/i.test(n));
    if(!idx)throw new Error('Keine HTML-Datei im ZIP gefunden.');
    const base=idx.includes('/')?idx.replace(/[^/]+$/,''):'';
    let html=await zip.file(idx).async('string');
    const read=async rel=>{const f=zip.file(base+rel.replace(/^\.?\//,''));return f?await f.async('string'):null};
    for(const m of [...html.matchAll(/<link[^>]+href=["']([^"':]+\.css)["'][^>]*>/gi)]){const c=await read(m[1]);if(c!==null)html=html.replace(m[0],`<style>${c}</style>`)}
    for(const m of [...html.matchAll(/<script[^>]+src=["']([^"':]+\.js)["'][^>]*><\/script>/gi)]){const c=await read(m[1]);if(c!==null)html=html.replace(m[0],()=>`<script>${c.replace(/<\/script/gi,'<\\/script')}<\/script>`)}
    openModal(`<div class="box"><div class="bar"><h3>${esc(p.title)}</h3><div class="row"><button class="btn ghost" id="fs">⛶ Vollbild</button><button class="btn ghost" id="x">Schließen</button></div></div><iframe sandbox="allow-scripts" allow="fullscreen" allowfullscreen id="fr"></iframe></div>`);
    $('#fr').srcdoc=html;
    $('#fs').onclick=()=>{const f=$('#fr'),rq=f.requestFullscreen||f.webkitRequestFullscreen;if(rq){rq.call(f);setTimeout(()=>f.focus(),400)}else $('.modal').classList.toggle('max')};
  }catch(e){toast(e.message)}
}
function openModal(h){$('#modal').innerHTML=`<div class="modal">${h}</div>`;const c=()=>$('#modal').innerHTML='';$('#x')&&($('#x').onclick=c);$('.modal').onclick=e=>{if(e.target.classList.contains('modal'))c()};window.closeModal=c}

function qrPng(el,name){

/* Lernmodus (Karteikarten) – mk(item,rev) liefert [Vorderseite, Rückseite] */
function learn(items,mk,title){
  if(!items.length)return toast('Keine Einträge zum Lernen.');
  let rev=false,q,known,total,flip,lock;
  openModal(`<div class="box sm"><div class="bar" style="margin:-24px -24px 16px"><h3>${esc(title)}</h3><div class="row"><button class="btn ghost" id="lrev">⇄ Richtung</button><button class="btn ghost" id="x">Schließen</button></div></div><div id="lb"></div><p class="meta lkeys">Leertaste = umdrehen · ← Nochmal · → Gewusst</p></div>`);
  const prog=()=>{$('#lp').style.width=(known/total*100)+'%';$('#lm').textContent=`${known} von ${total} gewusst · ${q.length} offen`};
  const start=()=>{
    q=[...items].sort(()=>Math.random()-.5);known=0;total=q.length;
    $('#lb').innerHTML='<div class="lprog"><i id="lp" style="width:0"></i></div><p class="meta" id="lm" style="margin-bottom:12px"></p><div id="lw"></div>';
    prog();card();
  };
  const done=()=>{
    const cf=Array.from({length:28},(_,i)=>`<i style="left:${Math.random()*100}%;background:hsl(${Math.random()*360},80%,60%);animation-delay:${Math.random()*.5}s;animation-duration:${1.4+Math.random()*1.2}s;transform:rotate(${Math.random()*360}deg)"></i>`).join('');
    $('#lw').innerHTML=`<div class="lc done" style="cursor:default"><div class="confetti">${cf}</div><div class="chk">✓</div><h2>Geschafft! 🎉</h2><p class="meta">Alle ${total} Karten gewusst.</p><button class="btn" id="lr">Nochmal lernen</button></div>`;
    $('#lr').onclick=start;
  };
  const card=()=>{
    lock=false;flip=false;
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    if(!q.length)return done();
    const [f,b]=mk(q[0],rev);
    $('#lw').innerHTML=`<div class="fc" id="fc"><div class="fc-in"><div class="face lc">${f}<p class="meta">Klicken zum Umdrehen</p></div><div class="face lc back">${b}</div></div></div>
    <div class="row lbtn" id="lbt"><button class="btn bad" id="lno">↺ Nochmal</button><button class="btn" id="lyes" style="background:var(--acc2)">Gewusst ✓</button></div>`;
    $('#fc').onclick=toggle;$('#lno').onclick=()=>ans(false);$('#lyes').onclick=()=>ans(true);
  };
  const toggle=()=>{const c=$('#fc');if(lock||!c||c.classList.contains('turning'))return;flip=!flip;c.classList.add('turning');$('#lbt').classList.toggle('show',flip);setTimeout(()=>{c.classList.toggle('flip',flip);c.classList.remove('turning')},180)};
  const ans=ok=>{
    if(lock||!flip)return;lock=true;
    $('#fc').classList.add(ok?'gone-y':'gone-n');
    if(ok){q.shift();known++}else q.push(q.shift());
    prog();setTimeout(card,360);
  };
  if(learn.kh)document.removeEventListener('keydown',learn.kh);
  learn.kh=e=>{
    if(!$('#lb')){document.removeEventListener('keydown',learn.kh);return}
    if(e.key==='Escape')return closeModal();
    if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}
    else if(e.key==='ArrowRight')ans(true);else if(e.key==='ArrowLeft')ans(false);
  };
  document.addEventListener('keydown',learn.kh);
  $('#lrev').onclick=()=>{rev=!rev;start()};start();
}

function startSync(){
  stopSync();

const NAME_MIN=3,NAME_MAX=20;
function checkName(n){
  if(n.length<NAME_MIN||n.length>NAME_MAX)return `Der Anzeigename braucht ${NAME_MIN}–${NAME_MAX} Zeichen.`;
  if(!/^[\p{L}\p{N}][\p{L}\p{N} ._-]*[\p{L}\p{N}]$/u.test(n))return 'Anzeigename: nur Buchstaben, Zahlen, Leerzeichen, . _ - (Anfang und Ende ohne Sonderzeichen).';
  if(/^(admin|administrator|root|support|moderator|lernhub|gast|guest)$/i.test(n))return 'Dieser Anzeigename ist reserviert.';
  return '';
}
function checkPw(p,email){
  if(p.length<10)return 'Das Passwort braucht mindestens 10 Zeichen.';
  if(p.length>72)return 'Das Passwort darf höchstens 72 Zeichen haben.';
  if(!/[A-Za-zÄÖÜäöüß]/.test(p)||!/\d/.test(p))return 'Das Passwort braucht Buchstaben und mindestens eine Zahl.';
  if(/^(passwort|password|12345|qwertz|qwerty)/i.test(p)||(email&&p.toLowerCase().includes(email.split('@')[0].toLowerCase())&&email.split('@')[0].length>2))return 'Das Passwort ist zu leicht zu erraten.';
  return '';
}

create table if not exists audit_log(id bigint generated always as identity primary key,created_at timestamptz default now(),user_id uuid,actor text,action text not null,detail text);
create index if not exists audit_log_time on audit_log(created_at desc);
alter table audit_log enable row level security;
drop policy if exists "admin read log" on audit_log; create policy "admin read log" on audit_log for select using(is_admin());
drop policy if exists "admin delete log" on audit_log; create policy "admin delete log" on audit_log for delete using(is_admin());
create or replace function log_event(a text,d text default null,who text default null) returns void language plpgsql security definer set search_path=public as $$
declare e text;
begin
  if a !~ '^[a-z_]{2,40}$' then return; end if;
  if auth.uid() is null and (select count(*) from audit_log where user_id is null and created_at>now()-interval '1 minute')>=30 then return; end if;
  select email into e from profiles where id=auth.uid();
  insert into audit_log(user_id,actor,action,detail) values(auth.uid(),coalesce(e,left(who,80),'Gast'),a,left(d,300));
end$$;
grant execute on function log_event(text,text,text) to anon,authenticated;`;

/* ---------- Duplikate ---------- */
const norm=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const DUPMSG='Diese Vokabel gibt es schon.';
function dupBtn(table,all,key,reload){
  const seen=new Set(),del=[];
  [...all].sort((a,b)=>a.id-b.id).forEach(w=>{const k=key(w);seen.has(k)?del.push(w):seen.add(k)});
  if(!del.length||!$('#vclr'))return;
  $('#vclr').innerHTML=`<button class="btn ghost" id="vdd">🧹 ${del.length} Duplikat${del.length>1?'e':''} bereinigen</button>`;
  $('#vdd').onclick=async()=>{if(!confirm(`${del.length} doppelte Einträge löschen? Der älteste bleibt erhalten.`))return;
    const p=del.map(w=>w.image_path).filter(Boolean);if(p.length)await sb.storage.from(BUCKET).remove(p);
    const x=await sb.from(table).delete().in('id',del.map(w=>w.id));x.error?toast(x.error.message):(toast('Bereinigt'),reload())};
}

  const cats=[...new Set(all.map(w=>w.category))].sort((a,b)=>a.localeCompare(b,'de'));if(vcat&&!cats.includes(vcat))vcat='';
  const urls={},paths=all.map(w=>w.image_path).filter(Boolean);
  if(paths.length){const s=await sb.storage.from(BUCKET).createSignedUrls(paths,3600);if(!s.error)s.data.forEach(o=>urls[o.path]=o.signedUrl);
    paths.forEach(p=>{urls[p]=urls[p]||sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl})}
  const img=w=>w.image_path?`<img src="${esc(urls[w.image_path])}" alt="${esc(w.term)}" loading="lazy">`:'';
  VB(`<header class="top"><div><h1>Biologie</h1><p class="meta" id="vc"></p></div><button class="btn" id="vlearn">🎓 Lernmodus</button></header>

  <label for="bd">Beschreibung</label><textarea id="bd" rows="3" maxlength="1000"></textarea><label for="bf">Bild (optional)</label><input id="bf" type="file" accept="image/*">
  <p class="meta" id="vdup" style="color:var(--bad);min-height:18px;margin-bottom:8px"></p><div class="row"><button class="btn" id="badd">Hinzufügen</button><span id="vclr"></span></div></div>`:''}
  <div class="vbar"><input id="vs" placeholder="Suchen …" value="${esc(vq)}"></div><div class="chips" id="vch"></div><div id="vl"></div>`);
  let cur=[];
  const card=w=>`<div class="card bio">${img(w)}<div class="bd"><h3>${esc(w.term)}</h3><p class="meta" style="font-size:14px;white-space:pre-wrap">${esc(w.description||'')}</p>${adm?`<div class="row" style="margin-top:auto"><button class="btn ghost" data-c="${w.id}">Kategorie</button><button class="btn ghost" data-x="${w.id}">Löschen</button></div>`:''}</div></div>`;
  const view=()=>{
    const q=vq.toLowerCase();cur=all.filter(w=>(!vcat||w.category===vcat)&&(w.term+' '+(w.description||'')).toLowerCase().includes(q));

    document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{vcat=b.dataset.k;view()});
    $('#vl').innerHTML=cats.filter(c=>cur.some(w=>w.category===c)).map(c=>{const l=cur.filter(w=>w.category===c);return `<details class="cat" open><summary><h2>${esc(c)}</h2><span class="meta">${l.length}</span></summary><div class="grid">${l.map(card).join('')}</div></details>`}).join('')||'<p class="empty">Keine Vokabeln gefunden.</p>';

      if(f){image_path=`bio/${Date.now()}_${f.name.replace(/[^\w.-]/g,'_')}`;const u=await sb.storage.from(BUCKET).upload(image_path,f,{contentType:f.type});if(u.error)return toast(u.error.message)}
      const x=await sb.from('vocab_bio').insert({term,description:$('#bd').value.trim(),image_path,category:$('#bk').value.trim()||vcat||'Allgemein'});
      if(x.error){if(image_path)await sb.storage.from(BUCKET).remove([image_path]);return toast(catErr(x.error))}
      toast('Gespeichert');logEv('vocab_add','Bio · '+term);vBio();
    };
  }
}

/* ---------- Eigene Dropdowns (native <select> bleibt als Datenquelle erhalten) ---------- */
(()=>{
  const desc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');let open=null;
  const close=()=>{open&&open.classList.remove('open');open=null};
  document.addEventListener('click',e=>{if(open&&!open.contains(e.target))close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  function enhance(s){
    if(s.dataset.dd)return;s.dataset.dd=1;
    const w=document.createElement('div'),b=document.createElement('button'),l=document.createElement('div');
    w.className='dd';b.type='button';b.className='ddb';b.setAttribute('aria-haspopup','listbox');l.className='ddl';l.setAttribute('role','listbox');
    s.parentNode.insertBefore(w,s);w.append(s,b,l);s.classList.add('hide');
    const dot=o=>o.dataset.c?`<b class="dot" style="background:${o.dataset.c}"></b>`:'';
    const render=()=>{const o=s.options[s.selectedIndex];
      b.innerHTML=`<span>${o?dot(o)+esc(o.text):''}</span><i></i>`;
      l.innerHTML=[...s.options].map((o,i)=>`<div role="option" class="ddo ${i===s.selectedIndex?'on':''}" data-i="${i}"><span>${dot(o)}${esc(o.text)}</span></div>`).join('')};
    Object.defineProperty(s,'value',{get(){return desc.get.call(s)},set(v){desc.set.call(s,v);render()},configurable:true});
    const pick=i=>{if(i<0||i>=s.options.length||i===s.selectedIndex)return;s.selectedIndex=i;render();s.dispatchEvent(new Event('change',{bubbles:true}))};
    b.onclick=()=>{if(w===open)return close();close();const r=b.getBoundingClientRect();
      w.classList.toggle('up',innerHeight-r.bottom<280&&r.top>innerHeight-r.bottom);w.classList.add('open');open=w;
      const on=l.querySelector('.on');on&&on.scrollIntoView({block:'nearest'})};
    l.onclick=e=>{const o=e.target.closest('.ddo');if(o){pick(+o.dataset.i);close();b.focus()}};
    b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pick(s.selectedIndex+(e.key==='ArrowDown'?1:-1))}};
    render();
  }
  const run=()=>document.querySelectorAll('select:not([data-dd])').forEach(enhance);
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});run();
})();

/* ---------- Einrichtung ---------- */
const SQL=`create table profiles(id uuid primary key references auth.users on delete cascade,email text,role text default 'user',created_at timestamptz default now());
create table packages(id bigint generated always as identity primary key,title text not null,description text,file_path text not null,size bigint,downloads int default 0,created_at timestamptz default now());
create function is_admin() returns boolean language sql security definer as $$select exists(select 1 from profiles where id=auth.uid() and role='admin')$$;
create function handle_new_user() returns trigger language plpgsql security definer as $$begin insert into profiles(id,email) values(new.id,new.email);return new;end$$;
create trigger on_signup after insert on auth.users for each row execute function handle_new_user();
create function increment_downloads(pid bigint) returns void language sql security definer as $$update packages set downloads=downloads+1 where id=pid$$;
alter table profiles enable row level security; alter table packages enable row level security;
create policy "own or admin" on profiles for select using(id=auth.uid() or is_admin());
create policy "admin edit" on profiles for update using(is_admin());
create policy "read pkgs" on packages for select to authenticated using(true);
create policy "admin pkgs" on packages for all using(is_admin()) with check(is_admin());
insert into storage.buckets(id,name,public) values('packages','packages',true);
create policy "admin upload" on storage.objects for insert with check(bucket_id='packages' and is_admin());
create policy "admin delete" on storage.objects for delete using(bucket_id='packages' and is_admin());
-- Dich zum Admin machen:
-- update profiles set role='admin' where email='deine@mail.de';`;
if(!configured)openModal(`<div class="box sm"><h2>Einrichtung</h2><p class="meta" style="margin:8px 0 12px">1. Supabase-Projekt anlegen, URL und anon key oben im Code eintragen.<br>2. Dieses SQL im SQL-Editor ausführen.<br>3. Registrieren und dich per letzter SQL-Zeile zum Admin machen.</p><pre>${esc(SQL)}</pre><div class="row" style="margin-top:12px"><button class="btn" id="cp">SQL kopieren</button><button class="btn ghost" onclick="closeModal()">Schließen</button></div></div>`),$('#cp').onclick=()=>{navigator.clipboard.writeText(SQL);toast('Kopiert')};
</script>
